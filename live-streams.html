<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    Greek WoW Streams - Greek Warcraft Market
  </title>

  <link
    rel="stylesheet"
    href="./style.css"
  >
</head>


<body>

<header>

  <!--
    Use the same header/nav you already
    use on the other pages.
  -->

</header>


<main class="streams-page">

  <section class="streams-hero">

    <p class="section-kicker">
      Greek World of Warcraft Community
    </p>

    <h1>
      🔴 Greek WoW Streams
    </h1>

    <p>
      Greek-language World of Warcraft streams
      currently live on Twitch.
    </p>

  </section>


  <!-- PLAYER -->

  <section
    id="streamPlayerSection"
    class="stream-player-section"
    hidden
  >

    <div
      id="streamPlayer"
      class="stream-player"
    ></div>

    <div class="stream-player-info">

      <h2 id="activeStreamer">
      </h2>

      <p id="activeStreamTitle">
      </p>

    </div>

  </section>


  <!-- STREAM LIST -->

  <section>

    <div
      id="streamsGrid"
      class="streams-grid"
    >

      <p>
        Loading live streams...
      </p>

    </div>

  </section>

</main>


<script src="./streams.js"></script>

</body>

</html>
