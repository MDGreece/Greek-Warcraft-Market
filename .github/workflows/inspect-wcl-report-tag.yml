name: Inspect WCL Report Tag

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Inspect report tag
        env:
          WARCRAFTLOGS_CLIENT_ID: ${{ secrets.WARCRAFTLOGS_CLIENT_ID }}
          WARCRAFTLOGS_CLIENT_SECRET: ${{ secrets.WARCRAFTLOGS_CLIENT_SECRET }}
        run: node scripts/inspect-wcl-report-tag.js

      - name: Upload inspection result
        uses: actions/upload-artifact@v4
        with:
          name: wcl-report-tag
          path: data/wcl-report-tag.json
