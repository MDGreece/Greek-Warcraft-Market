<main class="characters-page">

  <section class="characters-hero">
    <div>
      <p class="section-kicker">
        Greek World of Warcraft Community
      </p>

      <h1>Free Agents</h1>

      <p class="characters-intro">
        Browse characters currently without a Greek guild or playing
        outside the Greek leaderboard.
      </p>
    </div>

    <div class="characters-count-card">
      <span class="characters-count-label">
        Free Agents
      </span>

      <strong id="freeAgentCount">
        0
      </strong>
    </div>
  </section>

  <section class="characters-controls">

    <div class="character-filter-group">
      <label for="classFilter">
        Class
      </label>

      <select id="classFilter">
        <option value="">
          All Classes
        </option>
      </select>
    </div>

    <div class="character-filter-group">
      <label for="sortFreeAgents">
        Sort
      </label>

      <select id="sortFreeAgents">
        <option value="alphabetical">
          Alphabetical
        </option>

        <option value="mythic-plus">
          Mythic+ Score
        </option>

        <option value="raid-progress">
          Raid Progress
        </option>

        <option value="item-level">
          Item Level
        </option>
      </select>
    </div>

  </section>

  <section class="characters-table-card">

    <div class="characters-table-wrapper">

      <table class="characters-table">

        <thead>
          <tr>
            <th>Character</th>
            <th>Class / Spec</th>
            <th>Realm</th>
            <th>Guild</th>
            <th>Item Level</th>
            <th>Mythic+</th>
            <th>Raid Progress</th>
            <th>Achievement</th>
            <th>Links</th>
          </tr>
        </thead>

        <tbody id="freeAgentsTableBody">

          <tr>
            <td colspan="9" class="characters-loading">
              Loading free agents...
            </td>
          </tr>

        </tbody>

      </table>

    </div>

  </section>

</main>

<script src="free-agents.js"></script>
